<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Gruvbox Dark Colors */
            --bg: #000000;
            --bg-soft: #0d0d0d;
            --fg: #ffffff;
            --green: #0f0;
            --blue: #0bc;
            --pink: #ff0096;
            --gray: #888888;
            --yellow: #ffbf00;
            --red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            padding: 2rem;
            max-width: 900px;
            margin: 100px auto;
        }

        .tui-window {
            border: 1px solid var(--gray);
            border-radius: 0px;
            overflow: hidden;
        }

        .tui-titlebar {
            background-color: var(--blue);
            color: var(--bg);
            padding: 0.5rem 1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tui-titlebar-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .tui-button {
            width: 10px;
            height: 10px;
            border-radius: 1px;
        }

        .tui-close { background-color: var(--red); }
        .tui-minimize { background-color: var(--yellow); }
        .tui-maximize { background-color: var(--green); }

        .tui-content {
            padding: 1.5rem;
            background-color: var(--bg-soft);
        }

        .tui-section {
            margin-bottom: 2rem;
            border: 1px solid var(--gray);
            border-radius: 0px;
        }

        .tui-section-header {
            background-color: var(--bg);
            color: var(--bg);
            padding: 0.3rem 1rem;
            font-weight: 500;
        }

        .tui-section-content {
            padding: 1rem;
        }

        .tui-statusbar {
            background-color: var(--blue);
            color: var(--bg);
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        a {
            color: var(--blue);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        h1, h2, h3 {
            color: var(--green);
            margin: 1.5rem 0 1rem 0;
        }

        p {
            margin-bottom: 1rem;
        }

        code {
            background-color: var(--bg);
            padding: 0.2rem 0.4rem;
            border-radius: 0px;
            color: var(--pink);
        }

        pre {
            background-color: var(--bg);
            padding: 1rem;
            border-radius: 0px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .command-output {
            padding-left: 1rem;
            margin: 0.5rem 0;
        }

        .tui-menu {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background-color: var(--gray);
            margin-bottom: 1rem;
        }

        .tui-menu a {
            color: var(--bg);
            text-decoration: none;
            padding: 0.2rem 0.5rem;
        }

        .tui-menu a:hover {
            background-color: var(--bg);
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="tui-window">
        <div class="tui-titlebar">
            <div>samuel.louviot.site - {{ page.title }}</div>
            <div class="tui-titlebar-buttons">
                <div class="tui-button tui-minimize"></div>
                <div class="tui-button tui-maximize"></div>
                <div class="tui-button tui-close"></div>
            </div>
        </div>

        <div class="tui-menu">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/blog">Blog</a>
            <a href="/projects">Projects</a>
        </div>

        <div class="tui-content">
            {{ content }}
        </div>

        <div class="tui-statusbar">
            <div>© {{ site.time | date: '%Y' }} Samuel Louviot</div>
            <div>Press ? for help</div>
        </div>
    </div>
</body>
</html>
