<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg_h: #000000;
            --bg:   #000000;
            --bg_s: #000000;
            --bg1:  #161616;
            --bg2:  #202020;
            --bg3:  #2a2a2a;
            --bg4:  #343434;
          
            --fg:  #c4c4c4;
            --fg1: #d8d8d8;
            --fg2: #cccccc;
            --fg3: #c0c0c0;
            --fg4: #a8a8a8;
          
            --red:    #ff6666;
            --green:  #5ffa8c;
            --dark-green: #4a9718;
            --light-green: #50fa7b;
            --yellow: #f1fa8c;
            --blue:   #7282b4;
            --purple: #bd93f9;
            --aqua:   #8be9fd;
            --gray:   #808096;
            --orange: #ffb86c;
          
            --red-dim:    #e64545;
            --green-dim:  #40cf40;
            --yellow-dim: #e6e600;
            --blue-dim:   #5d5dff;
            --purple-dim: #a359ff;
            --aqua-dim:   #40e6e6;
            --gray-dim:   #909090;
            --orange-dim: #e69040;
          }
          
          /* Normal Colors */
          
          .red {
            color: var(--red);
          }
          
          .green {
            color: var(--green);
          }
          
          .yellow {
            color: var(--yellow);
          }
          
          .blue {
            color: var(--blue);
          }
          
          .purple {
            color: var(--purple);
          }
          
          .aqua {
            color: var(--aqua);
          }
          
          .gray {
            color: var(--gray);
          }
          
          .orange {
            color: var(--orange);
          }
          
          /* Dim Colors */
          
          .red-dim {
            color: var(--red-dim);
          }
          
          .green-dim {
            color: var(--green-dim);
          }
          
          .yellow-dim {
            color: var(--yellow-dim);
          }
          
          .blue-dim {
            color: var(--blue-dim);
          }
          
          .purple-dim {
            color: var(--purple-dim);
          }
          
          .aqua-dim {
            color: var(--aqua-dim);
          }
          
          .gray-dim {
            color: var(--gray-dim);
          }
          
          .orange-dim {
            color: var(--orange-dim);
          }
          
          /* Foreground Colors */
          
          .fg {
            color: var(--fg);
          }
          
          .fg1 {
            color: var(--fg1);
          }
          
          .fg2 {
            color: var(--fg2);
          }
          
          .fg3 {
            color: var(--fg3);
          }
          
          .fg4 {
            color: var(--fg4);
          }
          
          /* Background Colors */
          
          .bg-hard {
            color: var(--bg_h);
          }
          
          .bg {
            color: var(--bg);
          }
          
          .bg-soft {
            color: var(--bg_s);
          }
          
          .bg1 {
            color: var(--bg1);
          }
          
          .bg2 {
            color: var(--bg2);
          }
          
          .bg3 {
            color: var(--bg3);
          }
          
          .bg4 {
            color: var(--bg4);
          }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: var(--bg_h);
            color: var(--fg1);
            line-height: 1.6;
            padding: 0rem;
            max-width: 900px;
            margin: 100px auto;
        }

        .tui-window {
            border: 1px solid var(--dark-green);
            border-radius: 0px;
            overflow: hidden;
            /*box-shadow: 0 0 10px var(--dark-green);*/
        }

        .tui-titlebar {
            background-color: var(--dark-green);
            color: var(--bg_h);
            padding: 0.5rem 1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tui-titlebar-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .tui-button {
            width: 10px;
            height: 10px;
        }

        .tui-close { background-color: var(--red); }
        .tui-minimize { background-color: var(--yellow); }
        .tui-maximize { background-color: var(--green); }

        .tui-content {
            padding: 0rem;
            font-weight: 100;

            background-color: var(--bg_h);
        }

        .tui-section {
            margin-bottom: 0rem;
        }

        .tui-section-header {
            background-color: var(--bg_h);
            color: var(--green-dim);
            position: relative;
            display: block;
            font-weight: 100;
            font-size: 1.5rem;
            border-top: 1px dashed var(--dark-green);
            border-bottom: 1px dashed var(--dark-green);
            margin-top: 1rem;
            padding: 0rem 0rem;
        }
        
        .tui-section-header::before {
            font-weight: 100;
            content: '>_';
            padding: 0rem 1rem;
            margin-top: 1rem;
            margin-bottom: 0rem;
            margin-right: -1.5rem;
        }

        .tui-section-content {
            padding: 1rem;
        }

        .tui-statusbar {
            background-color: var(--dark-green);
            color: var(--bg_h);
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        a {
            color: var(--green-dim);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            text-decoration: none;
            color: var(--green);
            text-shadow: 0 0 8px var(--green-dim);
        }

        h1, h2, h3 {
            color: var(--dark-green);
            margin: 1.5rem 0 1rem 0;
        }

        p {
            margin-bottom: 1rem;
        }

        code {
            background-color: var(--bg1);
            padding: 0.2rem 0.4rem;
            border-radius: 0px;
            color: var(--purple);
            border: 1px solid var(--bg3);
        }

        pre {
            background-color: var(--bg1);
            padding: 1rem;
            border-radius: 0px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--bg3);
        }

        .command-output {
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: var(--fg2);
        }

        .highlight {
            color: var(--green-dim);
        }

        .tui-menu {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background-color: var(--bg_h);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--dark-green);
        }

        .tui-menu a {
            color: var(--dark-green);
            padding: 0.2rem 0.5rem;
            transition: all 0.2s ease;
        }

        .tui-menu a:hover {
            background-color: var(--dark-green);
            text-decoration: none;
            color: var(--bg_h);
            text-shadow: none;
        }

        ::selection {
            background-color: var(--dark-green);
            color: var(--bg_h);
        }
    </style>
</head>
<body>
    <div class="tui-window">
        <div class="tui-titlebar">
            <div>samuel.louviot.site - {{ page.title }}</div>
        </div>

        <div class="tui-menu">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/blog">Blog</a>
            <a href="/projects">Projects</a>
            <a href="/resume">Resume</a>
        </div>

        <div class="tui-content">
            {{ content }}
        </div>

        <div class="tui-statusbar">
            <div>© {{ site.time | date: '%Y' }} Samuel Louviot</div>
            <div>Press ? for help</div>
        </div>
    </div>
</body>
</html>
