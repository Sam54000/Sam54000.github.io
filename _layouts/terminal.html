<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Gruvbox Dark Colors */
            --bg: #000000;
            --bg-soft: #0d0d0d;
            --fg: #ffffff;
            --green: #0f0;
            --blue: #0bc;
            --pink: #ff0096;
            --gray: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            padding: 2rem;
            max-width: 750px;
            margin: 100px auto;
        }

        .terminal-window {
            margin-bottom: 2rem;
        }

        .command-block {
            margin-bottom: 1.5rem;
        }

        .prompt {
            color: var(--green);
        }

        .path {
            color: var(--pink);
        }

        .command {
            color: var(--blue);
        }

        a {
            color: var(--blue);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        h1, h2, h3 {
            color: var(--green);
            margin: 1.5rem 0 1rem 0;
        }

        p {
            margin-bottom: 1rem;
        }

        .content-block {
            margin: 1rem 0;
        }

        code {
            background-color: var(--bg-soft);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            color: var(--pink);
        }

        pre {
            background-color: var(--bg-soft);
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        footer {
            margin-top: 3rem;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .command-output {
            padding-left: 1rem;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="command-block">
            <span class="prompt">samuel@louviot</span>:<span class="path">~</span>$ <span class="command">cd {{ page.title | downcase }}</span>
        </div>
        <div class="command-block">
            <span class="prompt">samuel@louviot</span>:<span class="path">~/{{ page.title | downcase }}</span>$ <span class="command">cat content.txt</span>
        </div>
        <div class="command-output">
            {{ content }}
        </div>
    </div>

    <footer>
        <div class="command-block">
            <span class="prompt">samuel@louviot</span>:<span class="path">~</span>$ <span class="command">echo "© {{ site.time | date: '%Y' }} Samuel Louviot"</span>
        </div>
    </footer>
</body>
</html>
