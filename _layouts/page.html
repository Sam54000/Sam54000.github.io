---
layout: terminal
---

<div class="tui-section">
    <div class="tui-section-content page-content">
        {{ content }}
    </div>
</div>

<style>
    .page-content {
        line-height: 1.8;
    }

    .page-content p {
        margin-bottom: 1.5rem;
    }

    .page-content img {
        max-width: 100%;
        height: auto;
        margin: 1.5rem 0;
        border: 1px solid var(--gray);
    }

    .page-content blockquote {
        border-left: 3px solid var(--pink);
        padding-left: 1rem;
        margin: 1.5rem 0;
        color: var(--gray);
    }

    .page-content ul, 
    .page-content ol {
        margin: 1rem 0 1.5rem 2rem;
    }

    .page-content li {
        margin-bottom: 0.5rem;
    }

    .page-content h2, 
    .page-content h3, 
    .page-content h4 {
        color: var(--green);
        margin: 2rem 0 1rem 0;
    }

    /* Project and Blog specific styles */
    .project-entry,
    .post-entry {
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px dashed var(--dark-green);
    }

    .project-entry h2,
    .post-entry h2 {
        margin-top: 0;
    }

    .project-entry a,
    .post-entry a {
        color: var(--green);
        text-decoration: none;
    }

    .project-entry a:hover,
    .post-entry a:hover {
        color: var(--light-green);
        text-decoration: underline;
    }

    .post-meta {
        color: var(--gray);
        font-size: 0.9em;
        margin: 0.5rem 0;
    }

    /* Basic code block structure - syntax highlighting handled by Rouge */
    .page-content pre {
        margin: 0.5rem 0;
        padding: 0.5rem;
        overflow-x: auto;
        border: none;
        background-color: #151515;
    }

    /* Remove all borders and padding from Rouge containers */
    .page-content .code-highlight {
        margin: 0;
        padding: 0;
        border: none;
        background-color: #151515;
    }

    .page-content .code-highlight pre {
        border: none;
        margin: 0;
        background-color: #151515;
    }

    /* Remove line numbers */
    .page-content .code-highlight .lineno {
        display: none;
    }

    /* Remove the gap that line numbers create */
    .page-content .code-highlight .code {
        padding-left: 0;
        border: none;
    }

    /* Minimal styling for inline code */
    .page-content code {
        font-family: 'Sometype Mono', monospace;
        font-size: 1em;
        background-color: var(--bg3);
        border-radius: 3px;
    }

    /* Style for inline code */
    .page-content :not(pre) > code {
        padding: 0.2em 0.4em;
        background-color: var(--bg3);
        border-radius: 3px;
    }

    .page-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        border: none;
    }

    .page-content th,
    .page-content td {
        padding: 0.5rem;
        border: none;
    }

    .page-content th {
        background-color: var(--bg_h);
        color: var(--light-green);
        font-weight: 500;
    }

    .page-content tr:nth-child(even) {
        background-color: var(--bg_h);
    }
</style>
