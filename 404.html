    <div class="type-line">
        <span class="prompt">guest@samuel.louviot.site</span>:<span class="path">~</span>$ <span class="command typing-command">locate page</span>

    <div class="error-message typing-error">
        <span class="error-text">404 ERROR: PAGE NOT FOUND</span>
    </div>
    <div class="type-line">
        <span class="prompt">guest@samuel.louviot.site</span>:<span class="path">~</span>$ <span class="command">cd /home</span>
    </div>
    <div class="type-line">
        <span class="prompt">guest@samuel.louviot.site</span>:<span class="path">/home</span>$ <span class="cursor">█</span>
    </div>

<div class="help-text">
    <p>Lost? Try going back to the <a href="/">home page</a>.</p>

<style>
    .terminal-404 {
        background-color: var(--bg);
        padding: 2rem;
        font-family: 'IBM Plex Mono', monospace;
        border: 1px solid var(--gray);
    }

    .type-line {
        margin-bottom: 1rem;
        white-space: nowrap;
    }

    .prompt {
        color: var(--green);
    }

    .path {
        color: var(--pink);
    }

    .command {
        color: var(--blue);
    }

    .error-message {
        color: var(--red);
        margin: 1rem 0;
        padding-left: 2rem;
    }

    .cursor {
        display: inline-block;
        animation: blink 1s step-end infinite;
        color: var(--fg);
    }

    .typing-command {
        display: inline-block;
        width: fit-content;
        animation: typing 2s steps(11);
        overflow: hidden;
        white-space: nowrap;
    }

    .typing-error {
        display: inline-block;
        width: fit-content;
        animation: typing 2s steps(23) 2s forwards;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
    }

    .help-text {
        margin-top: 2rem;
        text-align: center;
        color: var(--gray);
    }

    .help-text a {
        color: var(--blue);
        text-decoration: none;
    }

    .help-text a:hover {
        text-decoration: underline;
    }

    @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
    }

    @keyframes typing {
        from {
            width: 0;
            opacity: 1;
        }
        to {
            width: 100%;
            opacity: 1;
        }
    }
</style>
